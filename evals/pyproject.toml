[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maxify-evals"
version = "1.0.0"
description = "Deterministic evaluation harness for the Maxify support agent"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
maxify-evals = "maxify_evals.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["maxify_evals*"]
