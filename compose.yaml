name: maxify-support

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U support -d support']
      interval: 3s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4318:4318'
      - '127.0.0.1:4317:4317'

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      PORT: '3000'
      APP_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgres://support:support@postgres:5432/support
      AUTO_BOOTSTRAP: 'true'
      SEED_DEMO: 'true'

      # Demo mode is the default. To use a live OpenAI-compatible model:
      #   MAXIFY_AGENT_MODE=live MAXIFY_OPENAI_API_KEY=... docker compose up --build
      AGENT_MODE: ${MAXIFY_AGENT_MODE:-demo}
      OPENAI_API_KEY: ${MAXIFY_OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${MAXIFY_OPENAI_BASE_URL:-https://api.openai.com/v1}
      CHAT_MODEL: ${MAXIFY_CHAT_MODEL:-gpt-4.1-mini}
      JUDGE_MODEL: ${MAXIFY_JUDGE_MODEL:-gpt-4.1}
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDINGS_MODE: auto

      OTEL_ENABLED: 'true'
      OTEL_SERVICE_NAME: maxify-support
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_HOST: 0.0.0.0
      OTEL_METRICS_PORT: '9464'
      JAEGER_UI_URL: http://127.0.0.1:16686
      LOG_LEVEL: info

      EVAL_API_TOKEN: ${EVAL_API_TOKEN:-local-eval-token-change-me}
      EVAL_PYTHON: python3
      RETURN_AUTO_APPROVE_LIMIT_CENTS: '50000'
      RATE_LIMIT_PER_MINUTE: '120'
      COOKIE_SECURE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:9464:9464'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

volumes:
  postgres_data:
  prometheus_data:
